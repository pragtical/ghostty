name: CI
on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Version tag to publish, for example v0.1.0.
          Leave empty for continuous only.
        required: false
        type: string
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Check manifest and select release
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          python3 scripts/check-release.py
          tag="$RELEASE_TAG"
          if [[ -z "$tag" && "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [[ -n "$tag" ]]; then
            version=$(python3 - <<'PY'
          import json
          print(json.load(open("manifest.json"))["addons"][0]["version"])
          PY
            )
            if [[ "$tag" != "v$version" ]]; then
              echo "Release tag must match manifest.json: v$version" >&2
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    env:
      PRAGTICAL_DATA_DIR: ${{ github.workspace }}/.test-pragtical/data
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64-linux
          - runner: ubuntu-24.04-arm
            arch: aarch64-linux
          - runner: macos-15
            arch: aarch64-darwin
          - runner: macos-15-intel
            arch: x86_64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Fetch Pragtical core modules for the LuaJIT tests
        uses: actions/checkout@v7.0.1
        with:
          repository: pragtical/pragtical
          ref: d3db654789e96df38f034bef7722ea0472f2393d # v3.13.0
          path: .test-pragtical
          sparse-checkout: data/core
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential python3 meson ninja-build luajit
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install meson ninja luajit
      - name: Build
        run: |
          meson setup build --buildtype=release -Dstrip=true \
            -Darch_tuple=${{ matrix.arch }} -Ddata_dir=/
          meson compile -C build
      - name: Verify generated bindings
        run: |
          python3 scripts/generate-ffi.py
          git diff --exit-code -- plugins/ghostty/ffi_defs.lua
      - name: Test native transport and FFI backend
        run: meson test -C build --print-errorlogs
      - name: Install stripped release binaries
        run: |
          meson install -C build --no-rebuild --tags runtime \
            --destdir "$PWD/package"
          python3 scripts/check-release.py package/plugins/ghostty \
            --arch ${{ matrix.arch }}
      - name: Test portable x86_64 binaries
        if: matrix.arch == 'x86_64-linux'
        run: |
          sudo apt-get install -y qemu-user
          runtime_dir="$PWD/package/plugins/ghostty"
          GHOSTTY_TEST_VT_ONLY=1 \
          GHOSTTY_RUNTIME="$runtime_dir/ghostty-vt.x86_64-linux.so" \
          GHOSTTY_PTY_RUNTIME="$runtime_dir/ghostty-pty.x86_64-linux.so" \
          GHOSTTY_ABI_PROBE="$PWD/build/abi-probe" \
            qemu-x86_64 -cpu Nehalem "$(command -v luajit)" tests/backend.lua
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ghostty-${{ matrix.arch }}
          path: package/plugins/ghostty/*
          if-no-files-found: error
  windows:
    needs: version
    runs-on: windows-latest
    env:
      PRAGTICAL_DATA_DIR: ${{ github.workspace }}/.test-pragtical/data
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Fetch Pragtical core modules for the LuaJIT tests
        uses: actions/checkout@v7.0.1
        with:
          repository: pragtical/pragtical
          ref: d3db654789e96df38f034bef7722ea0472f2393d # v3.13.0
          path: .test-pragtical
          sparse-checkout: data/core
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-luajit
      - name: Build and test Windows DLLs
        shell: msys2 {0}
        env:
          MSYS2_ARG_CONV_EXCL: '-Ddata_dir='
        run: |
          meson setup build --buildtype=release -Dstrip=true \
            -Darch_tuple=x86_64-windows -Ddata_dir=/
          meson compile -C build
          meson test -C build --print-errorlogs
          meson install -C build --no-rebuild --tags runtime \
            --destdir "$PWD/package"
          python3 scripts/check-release.py package/plugins/ghostty \
            --arch x86_64-windows
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ghostty-x86_64-windows
          path: package/plugins/ghostty/*
          if-no-files-found: error
  release:
    needs: [version, build, windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ghostty-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: ghostty-*
          path: artifacts
          merge-multiple: true
      - name: Verify complete release
        run: |
          python3 scripts/check-release.py artifacts \
            --checksums artifacts/SHA256SUMS
      - name: Publish binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(artifacts/*.so artifacts/*.dll artifacts/SHA256SUMS)
          publish() {
            local tag="$1" title="$2" prerelease="$3"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "${assets[@]}" --clobber
              gh release edit "$tag" --title "$title" \
                --notes-file release-notes.md \
                --prerelease="$prerelease"
            else
              gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" \
                --title "$title" --notes-file release-notes.md \
                --prerelease="$prerelease"
            fi
          }
          cat > release-notes.md <<EOF
          Ghostty terminal binaries for Pragtical, built from $GITHUB_SHA.

          The plugin manager downloads ghostty-vt and ghostty-pty
          for your platform. Manual installs need both libraries
          beside the Lua files in plugins/ghostty.
          EOF
          if [[ -n "$RELEASE_TAG" ]]; then
            publish "$RELEASE_TAG" "$RELEASE_TAG" false
            git push --force origin "$GITHUB_SHA:refs/tags/latest"
            publish latest latest false
            git push --force origin "$GITHUB_SHA:refs/heads/latest"
          fi
          git push --force origin "$GITHUB_SHA:refs/tags/continuous"
          publish continuous 'Continuous Release' true
